name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/RndTech.DevRel.App.Tests -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RndTech.DevRel.App/ClientApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/RndTech.DevRel.App/ClientApp/playwright-report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t devrel:ci .
      - run: docker run --rm --entrypoint sh devrel:ci -c 'test -f /wwwroot/index.html && ls /wwwroot/assets/*.js'
